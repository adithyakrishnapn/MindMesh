  <!-- Central AI Chip Emblem -->
  <rect x="160" y="160" width="80" height="80" rx="14" fill="#050811" stroke="#00E5FF" stroke-width="4" filter="url(#neonGlow)" />
  <text x="200" y="208" fill="#00E5FF" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="2">AI</text>
  <text x="200" y="226" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">HACKNEXT</text>

  <!-- Micro Circuit Traces -->
  <line x1="160" y1="180" x2="140" y2="180" stroke="#00E5FF" stroke-width="2" />
  <line x1="160" y1="200" x2="135" y2="200" stroke="#00E5FF" stroke-width="2" />
  <line x1="160" y1="220" x2="140" y2="220" stroke="#00E5FF" stroke-width="2" />

  <line x1="240" y1="180" x2="260" y2="180" stroke="#00E5FF" stroke-width="2" />
  <line x1="240" y1="200" x2="265" y2="200" stroke="#00E5FF" stroke-width="2" />
  <line x1="240" y1="220" x2="260" y2="220" stroke="#00E5FF" stroke-width="2" />
</svg>
